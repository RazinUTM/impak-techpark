<html lang="ms" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMPAK to the TechPark</title>
<meta name="description" content="A science and technology park management game for training of trainers. Bahasa Melayu and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* SPDX-License-Identifier: MIT
   Copyright (c) 2026 Ahmad Razin Zainal Abidin and Universiti Teknologi Malaysia */
:root {
  --font-scale: 1;
  --font: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* surfaces: gutters (bg) < side panels (panel) < blocks (card); header strips (card-head); viewport & inputs (view) */
  --bg: #dce4ed; --panel: #e8edf3; --card: #ffffff; --card-head: #f2f5f9; --view: #fbfdfe;
  --ink: #16202a; --ink2: #475564; --muted: #7d8c9b; --line: #ccd6e1; --line-soft: #e3e9f0;
  --shadow: 0 1px 2px rgba(15, 35, 60, 0.07), 0 2px 8px rgba(15, 35, 60, 0.05);
  --accent: #0e6b86; --accent-ink: #ffffff; --accent-soft: rgba(14, 107, 134, 0.10);
  /* block categories: inputs, guide/activities, theory, predictions, outputs, data */
  --acc-input: #2a78d6; --acc-guide: #e0a400; --acc-guide-ink: #2b2000; --acc-theory: #0f8b7d; --acc-predict: #7b5cd6; --acc-output: #0e6b86; --acc-data: #8795a3;
  --task-new-bg: #fff3c2; --task-new-line: #e0a400; --task-ok-bg: #e0f4e5; --task-ok-line: #1e9e4f;
  --water: rgba(42, 120, 214, 0.075); --surface-line: #2a78d6;
  --c-cable: #1a7f4f; --c-ref: #6250d6; --c-node: #eda100; --c-tip: #e34948; --c-flow: #2a78d6;
  --c-crit: #d03b3b; --c-good: #1e9e4f; --c-warn: #c98a0c; --c-pinB: #eb6834;
  --grid: #e3e8ec; --axis: #b9c3cd;
  --seabed-fill: rgba(140, 110, 70, 0.14); --seabed-line: #a08258;
  --bar: #1b2a3a; --bar-ink: #eef3f7; --bar-ink2: #a9b8c6; --bar-btn: #27394c; --bar-line: #35495d; --bar-accent: #5fc3d8; --bar-accent-ink: #06202a;
  --radius: 7px; --radius-blk: 10px;
}
:root[data-theme="dark"] {
  --bg: #050b13; --panel: #0a131f; --card: #111c2a; --card-head: #172437; --view: #0f1a27;
  --ink: #e6edf3; --ink2: #a9b7c4; --muted: #76879b; --line: #24364c; --line-soft: #1b2a3d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  --accent: #5fc3d8; --accent-ink: #06202a; --accent-soft: rgba(95, 195, 216, 0.14);
  --acc-input: #4b95ec; --acc-guide: #f0bf2a; --acc-guide-ink: #231a00; --acc-theory: #2fb8a6; --acc-predict: #9b84f0; --acc-output: #5fc3d8; --acc-data: #7c8a99;
  --task-new-bg: #3b3011; --task-new-line: #f0bf2a; --task-ok-bg: #11301e; --task-ok-line: #38c972;
  --water: rgba(57, 135, 229, 0.11); --surface-line: #3987e5;
  --c-cable: #2eaa6c; --c-ref: #9085e9; --c-node: #c98500; --c-tip: #e66767; --c-flow: #3987e5;
  --c-crit: #ff5b5b; --c-good: #38c972; --c-warn: #f0b429; --c-pinB: #e8743f;
  --grid: #1c2a3a; --axis: #35485d;
  --seabed-fill: rgba(190, 150, 100, 0.12); --seabed-line: #b08e5c;
  --bar: #050b14; --bar-ink: #eef3f7; --bar-ink2: #93a5b7; --bar-btn: #15243a; --bar-line: #2a3d55; --bar-accent: #5fc3d8; --bar-accent-ink: #06202a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: calc(14px * var(--font-scale)); line-height: 1.4;
  background: var(--bg); color: var(--ink);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; }
h2 { font-size: 0.95em; color: var(--ink2); margin: 0 0 6px; }
h3 { font-size: 0.9em; color: var(--ink2); margin: 10px 0 4px; }
p { margin: 0 0 8px; }

/* ---------------- top bar ---------------- */
.topbar { display: flex; align-items: center; gap: 18px; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(15, 35, 60, 0.07); flex-wrap: wrap; position: relative; z-index: 4; }
.brand h1 { font-size: 1.15em; letter-spacing: 0.01em; }
.brand .sub { color: var(--muted); font-size: 0.85em; }
/* stage navigator: ‹ [current stage ▾] › and the menu of modules and stages */
.stages { display: flex; align-items: center; gap: 4px; flex: 0 1 auto; min-width: 0; }
.sarrow { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--card-head); color: var(--ink2); flex: 0 0 auto; }
.sarrow svg, .scur .chev, .smhead .chev, .rtog .chev { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.sarrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.sarrow:disabled { opacity: 0.35; cursor: default; }
.sbox { position: relative; min-width: 0; }
.stage { display: flex; align-items: center; gap: 7px; padding: 4px 11px 4px 5px; border: 1px solid var(--line-soft); border-radius: 999px; background: var(--card-head); color: var(--ink2); position: relative; min-width: 0; }
.stage .n, .sitem .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 0.85em; font-weight: 700; flex: 0 0 auto; }
.stage.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.stage.active .n { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.stage:hover { border-color: var(--accent); }
.scur { max-width: min(46vw, 470px); padding-right: 9px; }
.scur .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.scur .chev { transition: transform 0.15s; }
.scur[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sprog { font-size: 0.72em; font-weight: 700; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, var(--acc-guide) 22%, transparent); color: var(--ink); white-space: nowrap; flex: 0 0 auto; }
.sprog.full { background: var(--c-good); color: #fff; }
.stage.active .sprog { background: color-mix(in srgb, var(--accent-ink) 25%, transparent); color: var(--accent-ink); }
.sdrop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: max(100%, 360px); max-height: min(72vh, 560px); overflow: auto; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(10, 25, 45, 0.22); }
.smod + .smod { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line-soft); }
.smhead { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font-size: 0.78em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: left; }
.smhead:hover, .smhead:focus-visible { background: var(--card-head); }
.smhead .chev { transform: rotate(-90deg); transition: transform 0.15s; }
.smod.open .smhead .chev { transform: none; }
.smhead .smt { flex: 1 1 auto; }
.smhead .smp { font-size: 0.95em; letter-spacing: 0; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, var(--acc-guide) 22%, transparent); color: var(--ink); }
.smod.own .smhead { color: var(--accent); }
.sitems { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 4px 10px; }
.sitem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; text-decoration: none; font-size: 0.92em; }
.sitem .name { flex: 1 1 auto; min-width: 0; }
.sitem:hover, .sitem:focus-visible { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.sitem.active { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.sitem.active .n { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.sitem.active .sprog { background: color-mix(in srgb, var(--accent-ink) 25%, transparent); color: var(--accent-ink); }
.sitem .here { font-size: 0.74em; font-weight: 400; opacity: 0.85; white-space: nowrap; }
.sitem.ext .n { border-style: dashed; }
.prefs { display: flex; align-items: center; gap: 6px; margin-left: auto; }
#btn-info svg { stroke-width: 2; }
#btn-info.hint { border-color: var(--acc-guide); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc-guide) 35%, transparent); animation: infohint 1.6s ease-in-out 4; }
@keyframes infohint { 0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc-guide) 35%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--acc-guide) 8%, transparent); } }
.prefs button { padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card-head); }
.prefs .iconbtn { display: inline-grid; place-items: center; width: 34px; height: 30px; padding: 0; }
.prefs .iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.prefs .fontbtns { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.prefs .fontbtns button { border: 0; border-radius: 0; }
.prefs .fontbtns button + button { border-left: 1px solid var(--line); }

/* ---------------- layout ---------------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 384px; min-height: 0; }
.controls { overflow: auto; border-right: 1px solid var(--line); padding: 0 10px 20px; background: var(--panel); }
/* centre column: viewport | results bar | KPI tiles | plots. The plots row shrinks on short screens and
   disappears when folded, so the viewport always gets the remaining height. */
.center { --plots-h: clamp(180px, 33vh, 278px); display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--bg); }
.results { display: grid; grid-template-rows: auto auto var(--plots-h); min-height: 0; }
.results > .reshead { grid-row: 1; } .results > #kpis { grid-row: 2; } .results > .plots { grid-row: 3; }   /* fixed rows: folding one part must not move the others */
body.lab-open .center { --plots-h: clamp(250px, 52vh, 448px); }
body.models-open .center { --plots-h: clamp(300px, 62vh, 568px); }
body.res-noplots .center { --plots-h: 0px; }
body.res-noplots .plots { display: none; }
body.res-nokpis #kpis { display: none; }
.explain { overflow: auto; border-left: 1px solid var(--line); padding: 0 12px 20px; background: var(--panel); }
.panelhead { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; margin: 0 -10px 10px; padding: 9px 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 0.76em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.explain .panelhead { margin: 0 -12px 10px; }
.panelhead .pdot { width: 11px; height: 11px; border-radius: 3px; background: var(--acc-input); flex: 0 0 auto; }
.panelhead.guide .pdot { background: var(--acc-guide); }

/* ---------------- controls ---------------- */
.group { --acc: var(--acc-input); padding: 0; margin: 0 0 8px; border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: var(--radius-blk); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
.group.g-cards { --acc: var(--acc-guide); }
.group.g-numerics { --acc: var(--acc-output); }
.group.g-export { --acc: var(--acc-data); }
.group > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 11px 8px 10px; cursor: pointer; background: var(--card-head); }
.group[open] > summary { border-bottom: 1px solid var(--line-soft); }
.group > summary:hover { background: color-mix(in srgb, var(--acc) 8%, var(--card-head)); }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: ''; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform 0.15s; flex: 0 0 auto; position: relative; top: -2px; }
.group[open] > summary::before { transform: rotate(45deg); top: -4px; }
.group > summary h2 { margin: 0; flex: 0 0 auto; color: var(--ink); font-size: 0.92em; }
.group > summary .status { margin-left: auto; font-size: 0.8em; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.group[open] > summary .status { display: none; }
.group > .body { padding: 4px 11px 10px; }
.group.cards > .body { padding-top: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; }
.fhead { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.fhead label { font-size: 0.86em; color: var(--ink2); }
.field.check .fhead { flex: 1 1 auto; }
.field.check .fhead label { color: var(--ink); }
.tag { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 0.68em; font-weight: 700; letter-spacing: 0.02em; line-height: 1.65; white-space: nowrap; }
.tag.restart { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--ink2); }
.tag.later { background: color-mix(in srgb, var(--acc-predict) 16%, transparent); color: var(--acc-predict); }
.field.later { background: color-mix(in srgb, var(--acc-predict) 6%, transparent); border-radius: 6px; padding: 3px 5px; margin-left: -5px; margin-right: -5px; }
.freset { margin-left: auto; display: inline-grid; place-items: center; width: 24px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--acc-input); flex: 0 0 auto; }
.freset:hover { border-color: var(--acc-input); background: color-mix(in srgb, var(--acc-input) 10%, var(--card)); }
.freset svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.freset.static { display: inline-grid; vertical-align: -4px; width: 20px; height: 18px; margin: 0; cursor: default; }
.ctrlbar { margin: 0 0 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-blk); background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 7px; }
.crow { display: flex; gap: 6px; }
.cbtn { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--card-head); color: var(--ink); font-size: 0.84em; font-weight: 700; white-space: nowrap; }
.cbtn:hover { border-color: var(--acc-input); }
.cbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.cchk { display: flex; gap: 7px; align-items: center; font-size: 0.84em; color: var(--ink2); cursor: pointer; }
.cchk input { accent-color: var(--acc-predict); }
.cchk.off { color: var(--muted); cursor: default; flex-wrap: wrap; }
.cchk .cnote { flex-basis: 100%; padding-left: 24px; font-size: 0.9em; }
.clegend { font-size: 0.74em; color: var(--muted); line-height: 1.6; }
.field input[type="number"], .field select { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--view); }
.field input:focus, .field select:focus { border-color: var(--acc-input); }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check label { color: var(--ink); }
.rangerow { display: flex; gap: 8px; align-items: center; }
.rangerow input[type="range"] { flex: 1 1 auto; accent-color: var(--accent); min-width: 0; }
.rangerow .num { width: 78px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--view); }
.note { font-size: 0.8em; color: var(--muted); margin: 6px 0 0; }
.help { font-size: 0.78em; color: var(--muted); margin: 3px 0 0; line-height: 1.4; }
.fielderr { font-size: 0.78em; color: var(--c-crit); margin-top: 2px; }
.fielderr:empty { display: none; }
input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
.field input[type="text"] { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--view); }
.cardlist { display: flex; flex-wrap: wrap; gap: 6px; }
.card { padding: 5px 10px; border: 1px solid color-mix(in srgb, var(--acc-guide) 45%, var(--line)); border-radius: 999px; background: color-mix(in srgb, var(--acc-guide) 7%, var(--card)); font-size: 0.86em; color: var(--ink); }
.card:hover { border-color: var(--acc-guide); }
.card.active { background: var(--acc-guide); color: var(--acc-guide-ink); border-color: var(--acc-guide); font-weight: 700; }
.exportbox { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.exportbox button, .filebtn span { padding: 5px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--view); font-size: 0.86em; display: inline-block; }
.exportbox button:hover, .filebtn:hover span { border-color: var(--accent); }
.filebtn input { display: none; }
.filebtn { cursor: pointer; }
.recrow { display: flex; align-items: center; gap: 8px; width: 100%; }
.recrow .rows { color: var(--muted); font-size: 0.82em; flex: 1 1 auto; }
.toggle .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 0; }
.toggle.on .dot { background: var(--c-crit); box-shadow: 0 0 0 3px rgba(208, 59, 59, 0.2); }
.toggle.on { border-color: var(--c-crit) !important; }

/* ---------------- viewport & KPIs ---------------- */
.viewport-wrap { position: relative; min-height: 0; }
#viewport { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--view); }
.legend { position: absolute; top: 8px; right: 10px; display: flex; gap: 12px; max-width: 70%; flex-wrap: wrap; justify-content: flex-end; font-size: 0.8em; color: var(--ink2); background: color-mix(in srgb, var(--view) 85%, transparent); padding: 3px 8px; border-radius: 5px; pointer-events: none; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--c-cable); vertical-align: middle; margin-right: 5px; }
.legend i.ref { border-top: 2px dashed var(--c-ref); }
.legend i.flow { border-top: 2px solid var(--c-flow); }
.legend #legend-pins span { margin-left: 10px; }
.vptools { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.8em; }
.vbtn { padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--ink2); }
.vbtn:hover { border-color: var(--accent); color: var(--ink); }
.vchk { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); background: color-mix(in srgb, var(--panel) 92%, transparent); padding: 2px 6px 2px 8px; border-radius: 5px; border: 1px solid var(--line); }
.vchk select { border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-size: 1em; padding: 1px 4px; }
#viewport { cursor: grab; }
#viewport:active { cursor: grabbing; }
.tooltip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font-size: 0.8em; opacity: 0; transition: opacity 0.12s; white-space: nowrap; }
.tooltip.show { opacity: 1; }
.viewport-wrap { border-bottom: 1px solid var(--line); }
/* results bar (fold the KPI tiles and the plots) */
.reshead { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 8px 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 0.76em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.reshead .pdot { width: 11px; height: 11px; border-radius: 3px; background: var(--acc-output); flex: 0 0 auto; }
.reshead .rtitle { flex: 0 0 auto; }
.rsum { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; overflow: hidden; white-space: nowrap; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 1.12em; color: var(--ink2); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.rsum:empty { -webkit-mask-image: none; mask-image: none; }
.rchip { flex: 0 0 auto; }
.rchip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.rchip b { color: var(--ink); }
.rchip.warn { border-color: color-mix(in srgb, var(--c-warn) 55%, var(--line)); }

/* ---------------- explain (guide panel) ---------------- */
.blk { --acc: var(--acc-theory); margin: 0 0 10px; border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: var(--radius-blk); background: var(--card); box-shadow: var(--shadow); }

@keyframes coachpulse { 0%, 100% { outline-color: var(--acc-guide); } 50% { outline-color: color-mix(in srgb, var(--acc-guide) 12%, transparent); } }
@media (prefers-reduced-motion: reduce) { #avatar.talk, .coach, .bubble.task-new { animation: none; } }
.actlist { margin: 8px 12px 4px 34px !important; padding: 0; font-size: 0.86em; color: var(--ink2); }

/* ---------------- transport ---------------- */

/* ---------------- spotlight, tour, screen guide ---------------- */
.spot { position: fixed; z-index: 60; pointer-events: none; border: 3px solid var(--acc-guide); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(6, 16, 28, var(--dim, 0.3)); animation: spotin 0.25s ease-out; }

.tourcall .tb, .sguide .tb { font-size: 0.88em; padding: 5px 12px; }
dialog.sguide { width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); overflow: hidden; }

.sghead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card-head); }

.imap { display: grid; gap: 5px; grid-template-columns: 1.1fr 2fr 1.25fr; grid-template-rows: 30px 54px 54px 30px;
  grid-template-areas: "stages stages prefs" "controls viewport guide" "controls results guide" "sim sim sim"; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.ireg { --acc: var(--acc-data); padding: 2px 6px; border: 1px solid color-mix(in srgb, var(--acc) 55%, var(--line)); border-left: 4px solid var(--acc); border-radius: 6px; background: color-mix(in srgb, var(--acc) 10%, var(--card)); color: var(--ink); font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

/* ---------------- laptop screens (e.g. 1366 × 768) ---------------- */
@media (max-width: 1500px) {
  .layout { grid-template-columns: 280px minmax(0, 1fr) 356px; }

#r-over { position: relative; z-index: 70; }
#app.fullpage { position: fixed; inset: 0; z-index: 50; overflow: auto; background: var(--bg); color: var(--ink); }
#app.fullpage .foot { padding: 12px 16px; font-size: 0.8em; color: var(--muted); }
body.fullpage > main, body.fullpage > footer { visibility: hidden; }

/* ---------- narrow screens */
@media (max-width: 1100px) {
  .center { grid-template-rows: 52vh auto; }
  #r-map { max-width: none; }
}
@media (max-width: 640px) {
  .join .two { grid-template-columns: 1fr; }
  .pinsgrid { grid-template-columns: 1fr; }
}

</style>

<header class="topbar">
  <div class="brand"><h1><span data-i18n="app.title">IMPAK</span> <small data-i18n="app.sub">to the TechPark</small></h1><div class="sub"><span id="mode-chip" class="modechip"></span></div></div>
  <nav class="stages" id="stages" role="tablist" aria-label="Level"></nav>
  <div class="prefs">
    <button type="button" id="btn-lang" data-i18n-title="pref.lang" title="Language">EN</button>
    <button type="button" id="btn-theme" class="iconbtn" title="Theme"></button>
    <span class="fontbtns" data-i18n-title="pref.font" title="Text size"><button type="button" id="btn-font-down" aria-label="Smaller text">A−</button><button type="button" id="btn-font-up" aria-label="Larger text">A+</button></span>
    <button type="button" id="btn-info" class="iconbtn" aria-label="About this screen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6h.01"/></svg></button>
  </div>
</header>

<main class="layout" id="shell">
  <aside class="controls" id="controls" aria-label="Controls">
    <div class="panelhead"><span class="pdot"></span><span data-i18n="panel.controls">Controls</span></div>
    <div class="ctrlnote g" id="ctrl-note"></div>
    <details class="group g-zone" id="grp-zone" open><summary><h2 data-i18n="grp.zone">Selected zone</h2><span class="status" id="zone-status"></span></summary><div class="body g" id="r-zone"></div></details>
    <details class="group g-apps" id="grp-apps" open><summary><h2 data-i18n="grp.apps">Applicants</h2><span class="status" id="apps-status"></span></summary><div class="body g" id="r-apps"></div></details>
    <details class="group g-money" id="grp-money"><summary><h2 data-i18n="grp.money">Money</h2><span class="status" id="money-status"></span></summary><div class="body g" id="r-money"></div></details>
    <details class="group g-fac" id="grp-fac"><summary><h2 data-i18n="grp.fac">Facilities and programmes</h2><span class="status" id="fac-status"></span></summary><div class="body g" id="r-fac"></div></details>
  </aside>

  <section class="center">
    <div class="viewport-wrap" id="vpwrap">
      <div class="vpscroll" id="vpscroll"><div class="vpzoom" id="vpzoom"><div id="r-map" class="g planbox"></div><div class="g maplegwrap" id="r-leg"></div></div></div>
      <div class="vptools" data-i18n-title="vp.zoom.tip" title="">
        <button type="button" id="vp-pinA" class="vbtn" data-i18n="vp.pinA" data-i18n-title="vp.pin.tip">Pin A</button>
        <button type="button" id="vp-pinB" class="vbtn" data-i18n="vp.pinB" data-i18n-title="vp.pin.tip">Pin B</button>
        <button type="button" id="vp-clear" class="vbtn" data-i18n="vp.clearPins" hidden>Clear pins</button>
        <button type="button" id="vp-fit" class="vbtn" data-i18n="vp.fit">Fit</button>
      </div>
      <div id="r-land" class="g landing" hidden></div>
    </div>
    <div class="results" id="results">
      <div class="reshead" id="reshead"></div>
      <div class="kpis g" id="r-tiles"></div>
      <div class="plots" id="plots">
        <div class="tabs" id="plot-tabs" role="tablist">
          <button type="button" class="active" data-plot="park" data-i18n="tab.park">Park</button>
          <button type="button" data-plot="impact" data-i18n="tab.impact">Impact</button>
          <button type="button" data-plot="stand" data-i18n="tab.stand">Standings</button>
          <button type="button" data-plot="news" data-i18n="tab.news">News</button>
          <button type="button" data-plot="pins" data-i18n="tab.pins" id="tab-pins" hidden>Pins</button>
          <button type="button" data-plot="rules" data-i18n="tab.rules">Rules</button>
        </div>
        <div class="plotarea g" id="r-tab"></div>
      </div>
    </div>
  </section>

  <aside class="explain" aria-label="Guide">
    <div class="panelhead guide"><span class="pdot"></span><span data-i18n="panel.guide">Guide</span></div>
    <section class="blk guide">
      <div class="avatar-row">
        <img id="avatar" alt="Tutor" width="92" height="178">
        <div class="bubble" id="bubble">
          <div class="task" id="task" aria-live="polite" hidden></div>
          <div class="say" id="say" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <div id="r-banner" class="g banners"></div>
    <section class="blk predict" id="predict" hidden></section>
    <details class="blk checklist" id="checklist" open></details>
    <details class="blk why"><summary data-i18n="ex.why">Why?</summary><div id="why"></div></details>
    <details class="blk ledgerbox"><summary data-i18n="ex.ledger">Assumption ledger</summary><ul id="ledger"></ul></details>
    <div id="log"></div>
  </aside>
</main>

<footer class="transport">
  <div class="tgroup main">
    <button type="button" id="btn-play" class="tbtn primary" data-i18n-title="tr.play.tip">
      <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
      <svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>
      <span class="lbl" id="lbl-play">Play</span></button>
    <button type="button" id="btn-step" class="tbtn" data-i18n-title="tr.step.tip">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5v15l9-7.5z"/><path d="M16 4.5h3v15h-3z"/></svg>
      <span class="lbl" data-i18n="tr.step">Next event</span></button>
    <button type="button" id="btn-reset" class="tbtn" data-i18n-title="tr.reset.tip">
      <svg class="ic stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 3.8v4.6h-4.6"/></svg>
      <span class="lbl" data-i18n="tr.reset">New game</span></button>
  </div>
  <label class="tgroup speed"><span class="ro" data-i18n="tr.speed">Pace</span>
    <select id="sel-speed"><option value="5000">5 s</option><option value="10000" selected>10 s</option><option value="20000">20 s</option><option value="60000">60 s</option></select>
    <span class="ro" data-i18n="tr.perMonth">per month</span>
  </label>
  <span class="spacer"></span>
  <div class="readouts" id="readouts"></div>
</footer>
<div id="r-over" class="g"></div>
<div id="app" class="g fullpage" hidden></div>
<div class="toast" id="toast" role="status"></div>

/* ---------------------------------------------------------------- randomness */
function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function U(seed, ...k) { return (hash(seed + "|" + k.join("|")) % 1000003) / 1000003; }
function D6(seed, ...k) { return 1 + Math.floor(U(seed, ...k) * 6); }

/* ---------------------------------------------------------------- scenario */
function makeScenario(seed, level) {
  seed = String(seed); const lv = levelOf(level); const MONTHS = lv.months;
  const arrivals = {};
  for (let m = 1; m <= MONTHS; m++) {
    const u = U(seed, "arr", m); const n = u < 0.25 ? 0 : (u < 0.8 ? 1 : 2);
    arrivals[m] = [];
    for (let k = 0; k < n; k++) arrivals[m].push(applicant(seed, "a" + m + "-" + k, pickType(U(seed, "arrT", m, k)), m));
  }
  // event months: 3 a year, at least two months apart, never in month 1
  const events = []; const order = {};
  for (const ph in lv.decks) {
    const d = lv.decks[ph].slice(); d.sort((a, b) => U(seed, "deck", a) - U(seed, "deck", b)); order[ph] = d;
  }
  const used = {}; for (const ph in lv.decks) used[ph] = 0;
  const SLOTS = { 1: [[5, 8]], 2: [[3, 5], [8, 10]], 3: [[2, 4], [5, 8], [9, 12]] };
  lv.years.forEach(([ph, n], yi) => {
    const y = yi + 1, slots = SLOTS[n];
    for (let s = 0; s < n; s++) {
      const [lo, hi] = slots[s]; const mo = lo + Math.floor(U(seed, "evm", y, s) * (hi - lo + 1));
      const card = order[ph][used[ph]++]; if (!card || (lv.take && used[ph] > lv.take[ph])) continue;
      const m = (y - 1) * 12 + mo;
      events.push({ id: "e" + y + s, card, t: m - 1 + 0.45 + U(seed, "evd", y, s) * 0.1, month: m, phase: ph, deal: lv.dice ? D6(seed, "deal", y, s) : 6 });
    }
  });
  events.sort((a, b) => a.t - b.t);
  let downturn;
  if (lv.downturn) {
    const sr = U(seed, "sev"); const W = lv.downturn.sevs, tot = W.reduce((a, x) => a + x[1], 0); let acc = 0, sev = W[W.length - 1][0];
    for (const [k, w] of W) { acc += w / tot; if (sr < acc) { sev = k; break; } }
    const start = lv.downturn.startMin + Math.floor(U(seed, "dstart") * lv.downturn.startSpan);
    downturn = { start, sev, forecastAt: lv.downturn.forecast ? start - lv.downturn.forecast : null };
  } else downturn = { start: 9999, sev: "mild", none: true, forecastAt: null };
  return { seed, level: lv.key, lv, months: MONTHS, arrivals, events, downturn, flood: U(seed, "flood") < CFG.FLOOD.p, approvalLate: U(seed, "approval") < CFG.WORKS.clear.delayP,
           leaseDefaultU: U(seed, "leasedef"), jvExit: U(seed, "jvexit") < 0.5, inquiryWithdraw: U(seed, "inq") < 1 / 3 };
}
function pickType(u) { let a = 0; for (const [t, p] of CFG.MIX) { a += p; if (u < a) return t; } return "sme"; }
function applicant(seed, id, type, m) {
  const a = NAMES_A[Math.floor(U(seed, "nA", id) * NAMES_A.length)], bl = NAMES_B[type] || NAMES_B.sme;
  return { id, type, arrive: m, expire: m + CFG.WAIT - 1, name: a + " " + bl[Math.floor(U(seed, "nB", id) * bl.length)] };
}

function usedUnits(t, b) {
  let u = 0; for (const x of t.tenants) if (x.bid === b.id) u += CFG.TEN[x.type].units;

// cost split: the fund pays 80% of capital while it lasts (Phase 1)
function capitalSplit(t, cost, m, capital) {

  if (Z.svc.road < 1 && !busy("road")) opts.push(Z.svc.road === 0.5 ? "roadHalf" : "road");
  if (Z.svc.water < 1 && !busy("water")) opts.push("water");
  if (Z.svc.power < 1 && !busy("power")) opts.push(CFG.ADJ[zone].some(n => t.zones[n].svc.power >= 1) ? "powerShared" : "power");

/* validate returns {ok, why, ap, cost, cash, fund} without changing state */
function validate(t, sc, o, m) {
  if (t.receiver) return { ok: false, why: "The park is in receivership." };
  const ap = { work: 1, build: 1, facility: 1, policy: 1, reneg: 1, moth: 1, unmoth: 1, leaseback: 1, programme: 1 }[o.type] || 0;
  if (ap > t.ap) return { ok: false, why: "No action points left this quarter." };
  const need = (cost, capital) => { const s = capitalSplit(t, cost, m, capital); if (s.cash > t.cash + 1e-9) return { ok: false, why: "Not enough cash (" + r1(s.cash) + " Cr needed). Borrow first.", ap, cost, ...s }; return { ok: true, ap, cost, ...s }; };
  switch (o.type) {
    case "work": {

      const opts = worksOptions(t, o.zone, m); if (!opts.includes(o.kind)) return { ok: false, why: "That work is not available in this zone now." };
      return need(CFG.WORKS[o.kind].cost, true);
    }
    case "build": {
      const B = CFG.BUILD[o.kind];
      if (o.kind === "retrofit") { const b = bById(t, o.bid); if (!b || b.status !== "shed") return { ok: false, why: "Choose a shed to retrofit." }; return need(B.cost, true); }

      return need(B.cost, true);
    }
    case "facility": {
      if (t.fac[o.kind]) return { ok: false, why: "Already running." };
      if (o.kind === "incubator" && t.flags.jv) { /* allowed */ }
      if (CFG.FAC[o.kind].units && !facSpace(t, o.kind)) return { ok: false, why: "Needs a free unit in a ready building with fibre." };
      return need(CFG.FAC[o.kind].cost, true);
    }
    case "admit": {
      const a = t.applicants.find(x => x.id === o.aid); if (!a) return { ok: false, why: "That applicant has gone." };
      if (!admissionAllowed(t, a.type)) return { ok: false, why: a.type === "startup" ? "No free incubator place." : (a.type === "anchor" && !hasLabLike(t) ? "An anchor needs a Lab or Lab Access." : "Your admission policy does not allow this applicant.") };
      if (a.type !== "startup" && !findSpace(t, a.type)) return { ok: false, why: CFG.TEN[a.type].tech ? "No free unit with road, water, power and fibre." : "No free unit with road, water and power." };

      if (o.zone === "G" && Z.mode === "open" && Z.protected && Z.plotsUsed === 0) return { ok: true, ap: 0, cost: 0, cash: 0, fund: 0 };

    }

function applyOrder(t, sc, o, m) {
  const v = validate(t, sc, o, m);
  if (!v.ok) { note(t, m, "Order refused: " + v.why, "warn"); return false; }
  t.ap -= v.ap || 0;
  if (v.fund) { t.fund -= v.fund; t.fundUsed += v.fund; }
  if (v.cash) t.cash -= v.cash;
  switch (o.type) {
    case "work": {
      const W = CFG.WORKS[o.kind]; let months = W.months;
      if (o.kind === "clear" && sc.approvalLate) months += W.delay;
      t.zones[o.zone].works.push({ kind: o.kind, doneAt: m + months - 1, startAt: m });
      if (o.kind === "clear") esg(t, m, CFG.ESG.clear, "forest clearance on the ridge");
      note(t, m, W.label + " started in Zone " + o.zone + (o.kind === "clear" && sc.approvalLate ? " (approval delayed 3 months)" : "") + "; done end of " + monthName(m + months - 1) + ".");
      break;
    }
    case "build": {
      const B = CFG.BUILD[o.kind];

        const b = bById(t, o.bid); b.status = "building"; b.kind = "retrofit"; b.units = B.units; b.upkeep = B.upkeep; b.readyAt = m + B.months - 1; b.startAt = m; b.label = "Workshop " + b.id;

      else if (!spec && u < CFG.SPEC.gateDelayP) months += CFG.SPEC.overrunMonths;
      if (extra) { t.cash -= extra; }
      const id = o.zone + (t.buildings.filter(b => b.zone === o.zone).length + 1);
      t.buildings.push({ id, zone: o.zone, kind: o.kind, label: B.label + " " + id, units: B.units, upkeep: B.upkeep, readyAt: m + months - 1, startAt: m, status: "building", spec });
      if (o.zone === "H") t.hplots[t.hplots.indexOf(null)] = "build"; else t.zones[o.zone].plotsUsed++;
      if (o.zone === "G") esg(t, m, CFG.ESG.buildWet, "building on the former wetland");
      note(t, m, B.label + " " + id + " started" + (spec ? " (speculative: no demand gate)" : "") + (extra ? "; overrun +" + extra + " Cr" : "") + "; ready end of " + monthName(m + months - 1) + ".", spec ? "warn" : "info");
      break;
    }
    case "facility": { const s = facSpace(t, o.kind); t.fac[o.kind] = { bid: s ? s.bid : null, since: m }; note(t, m, CFG.FAC[o.kind].label + " launched."); break; }
    case "admit": {
      const a = t.applicants.find(x => x.id === o.aid); t.applicants = t.applicants.filter(x => x.id !== o.aid);
      if (a.type === "startup") { t.startups.push({ id: a.id, name: a.name, since: m }); note(t, m, a.name + " joined the incubator."); }
      else {
        const b = findSpace(t, a.type); t.tenants.push({ id: a.id, type: a.type, bid: b.id, since: m, name: a.name });
        if (CFG.TEN[a.type].linked && t.flags.exclusive) t.flags.exclQ = (t.flags.exclQ || 0) + 1;
        note(t, m, a.name + " (" + CFG.TEN[a.type].label + ") moved into " + b.id + ".");
      }
      break;
    }
    case "reserve": { t.hplots[t.hplots.indexOf(null)] = "reserve"; note(t, m, "A Zone H plot was reserved for a named future user."); break; }
    case "declare": {
      const Z = t.zones[o.zone];
      if (o.zone === "F") { Z.mode = "buffer"; note(t, m, "Forest Ridge declared a green buffer (+1 impact a year)."); esg(t, m, CFG.ESG.buffer, "green buffer kept on the ridge"); }
      else { Z.mode = "park"; note(t, m, "Wetland made a retention park (+1 impact a year)."); esg(t, m, CFG.ESG.park, "wetland kept as a retention park"); }
      break;
    }
    case "loan": t.debt += o.amount; t.cash += o.amount; note(t, m, "Borrowed " + o.amount + " Cr."); break;
    case "repay": { let a = o.amount; const e = Math.min(a, t.emerg); t.emerg -= e; a -= e; t.debt -= a; t.cash -= o.amount; note(t, m, "Repaid " + o.amount + " Cr."); break; }
    case "policy": t.policy = o.policy; t.ipv -= 2; note(t, m, "Admission policy changed to " + o.policy + " (−2 impact).", "warn"); break;
    case "reneg": for (const x of t.tenants) if (x.type === "backoffice") x.reneg = m + 11; t.flags.renegUntil = m + 11; note(t, m, "Back-office rents renegotiated to 70% for 12 months."); break;
    case "moth": { const b = bById(t, o.bid); b.status = "moth"; note(t, m, b.id + " mothballed."); break; }
    case "unmoth": { const b = bById(t, o.bid); b.status = "ready"; note(t, m, b.id + " reopened."); break; }
    case "leaseback": { const b = bById(t, o.bid); const p = b.kind === "newbuild" ? 5 : 3; b.leaseBack = b.kind === "newbuild" ? 0.7 : 0.4; t.cash += p; note(t, m, b.id + " sold for " + p + " Cr and leased back."); break; }
    case "cancel": { const f = t.fac[o.kind]; delete t.fac[o.kind]; note(t, m, CFG.FAC[o.kind].label + " closed.", "warn"); break; }
    case "programme": t.prog = o.level; note(t, m, "Innovation programme budget set to " + o.level + " Cr a year."); break;
  }
  t.seq++;
  return true;
}

/* ---------------------------------------------------------------- events */
function eligible(card, t, m) {
  switch (card) {
    case "contractor": return plotsAvailableForBuild(t, m) >= 1;
    case "datacentre": return plotsFree(t, "D", m) >= 1 || siteOptions(t, m).length > 0;
    case "chemical": return !!findSpace(t, "chem");
    case "flood": return !(t.zones.E.locked && t.zones.G.locked);
    case "greencert": return true;
    case "audit": return true;
    case "drought": return true;
    case "inquiry": return plotsAvailableForBuild(t, m) >= 1;
    case "developer": return t.hplots.includes(null);
    case "bts": return t.hplots.includes(null) || hasLabLike(t);
    case "natlab": return t.hplots.includes("reserve");
    case "holiday": return t.tenants.some(x => x.type === "anchor" || x.type === "bigAnchor");
    case "stimulus": return !!(t.fac.incubator || t.flags.jv);
    default: return true;
  }
}
function plotsAvailableForBuild(t, m) { let n = 0; for (const z of ["C", "D", "E", "F", "G", "H"]) if (canBuildIn(t, z, m)) n += plotsFree(t, z, m); return n; }
function bestBuildZone(t, m) {
  const order = ["C", "E", "D", "H", "G", "F"].filter(z => canBuildIn(t, z, m) && plotsFree(t, z, m) > 0);
  order.sort((a, b) => svcScore(t, b) - svcScore(t, a)); return order[0] || null;
}
function svcScore(t, z) { const s = t.zones[z].svc; return s.road + s.water + s.power + s.fibre; }
function sound(card, opt, t, m) {
  switch (card) {
    case "contractor": return opt !== "T" || (occupancy(t) >= CFG.SPEC.gateOcc && t.fund >= 9.6);
    case "datacentre": return opt === "L" || (opt === "C" ? true : (driftOf(t, 2, 2) <= 0.5 && plotsFree(t, "D", m) >= 1 && t.esg + CFG.ESG.dcOffered >= 0));
    case "chemical": return opt !== "T" && (opt !== "C" || (driftOf(t, 2, 2) <= 0.5 && t.esg + CFG.ESG.chemC >= 0));
    case "greencert": return opt === "T" ? t.cash >= 2 : t.cash < 2;
    case "audit": return t.esg >= 2 ? true : opt !== "L";
    case "drought": return opt !== "L" || t.zones.G.mode === "park";
    case "donor": return (opt !== "T" || linkedCount(t) >= 2) && (opt !== "C" || linkedCount(t) >= 1);
    case "jv": return opt !== "T";
    case "flood": return opt !== "L" || !t.buildings.some(b => (b.zone === "E" || b.zone === "G") && b.status !== "shed");
    case "developer": return opt !== "T" || driftOf(t, 4, 4) <= 0.5;
    case "bts": return opt !== "T" || 6 / (capUnits(t) + 6) <= 0.4;
    case "agency": return opt !== "T" || driftOf(t, 3, 3) <= 0.5;
    case "rector": return opt !== "L";
    case "factory": return opt !== "T" || occupancy(t) >= CFG.SPEC.gateOcc;
    case "natlab": return opt !== "L";
    case "holiday": { const rent = t.tenants.filter(x => x.type === "anchor" || x.type === "bigAnchor").reduce((a, x) => a + CFG.TEN[x.type].rent, 0); return opt !== "L" || rent <= 0.3 * Math.max(0.1, committedIncome(t)); }
    case "restructure": return (opt === "T") === (t.debt + t.emerg >= 5);
    case "stimulus": return opt !== "L";
    default: return true;
  }
}
function applyEvent(t, sc, ev, opt, m) {
  const card = ev.card, C = CARDS[card];
  let site = null; if (opt && typeof opt === "object") { site = opt.zone || null; opt = opt.opt; }
  if (!eligible(card, t, m)) { t.dlog.push({ eid: ev.id, card, opt: null, eligible: false }); note(t, m, C.title + ": does not apply to your park."); return; }
  if (!opt || (opt === "C" && !C.C)) opt = opt === "C" ? "L" : (opt || "L");
  if (!(C.site && C.site[opt]) || !site || !t.zones[site]) site = null;
  const s = sound(card, opt, t, m);
  // leaving an opportunity when a sound way to engage existed earns half credit: a missed chance, not a mistake
  const missed = s && opt === "L" && C.tone === "opportunity" && (sound(card, "T", t, m) || (C.C && sound(card, "C", t, m)));
  t.dlog.push({ eid: ev.id, card, opt, site, sound: s, credit: s ? (missed ? 0.5 : 1) : 0, dare: C.dare[opt] || 0, eligible: true });
  const die = ev.deal, ok3 = die >= 3, ok4 = die >= 4;
  const say = txt => note(t, m, C.title + ": " + txt, "event");
  const payCap = cost => { const sp = capitalSplit(t, cost, m, true); t.fund -= sp.fund; t.fundUsed += sp.fund; t.cash -= sp.cash; };
  const pickZone = () => (site && canBuildIn(t, site, m) && plotsFree(t, site, m) > 0) ? site : bestBuildZone(t, m);
  const startBuild = (zone, kind, months, preLet) => {
    const B = CFG.BUILD[kind]; const id = zone + (t.buildings.filter(b => b.zone === zone).length + 1);
    t.buildings.push({ id, zone, kind, label: B.label + " " + id, units: B.units, upkeep: B.upkeep, readyAt: m + months - 1, startAt: m, status: "building", preLet });
    if (zone === "H") t.hplots[t.hplots.indexOf(null)] = "build"; else if (zone !== "X") t.zones[zone].plotsUsed++;
    return id;
  };
  switch (card) {
    case "contractor":
      if (opt === "T") { payCap(12); for (let i = 0; i < 2; i++) { const z = pickZone(); if (z) startBuild(z, "newbuild", 12); } say("two New Builds under way" + (site ? " in Zone " + site : "") + "."); }
      else if (opt === "C") { if (ok3) { payCap(6.5); const z = pickZone(); if (z) startBuild(z, "newbuild", 12); say("one New Build under way" + (z ? " in Zone " + z : "") + "."); } else say("the contractor walked away."); }
      break;
    case "datacentre":
      if (opt === "T") { if (plotsFree(t, "D", m) < 1) { say("no free plot on Zone D: the operator went elsewhere."); break; } t.zones.D.plotsUsed++; t.leases.push({ kind: "dc", label: "Data-centre lease (D)", income: 1.5, linked: false, units: 2, ip: 0, crisis: true }); esg(t, m, CFG.ESG.dcOffered, "data centre on grid power, no conditions"); say("lease signed as offered."); }
      else if (opt === "C") {
        const opts = siteOptions(t, m); const z = site && opts.includes(site) ? site : (opts.includes("D") ? "D" : opts[0]);
        if (!z) { say("no plot to offer."); break; }
        const ST = siteTerms(t, z, m, true);
        if (die >= ST.thresh) {
          if (z === "H") t.hplots[t.hplots.indexOf(null)] = "leaseC"; else t.zones[z].plotsUsed++;
          t.leases.push({ kind: "dcC", label: "Data-centre lease with covenant (" + z + ")", income: r1(1.0 * ST.mult), linked: true, units: 2, ip: 1 + ST.ip, crisis: false, zone: z });
          if (ST.esg) esg(t, m, ST.esg, "data centre sited on Zone " + z);
          say("lease signed with conditions on Zone " + z + (ST.waits ? "; income starts once the zone has road and power." : "."));
        } else say("the operator declined the plot on Zone " + z + " (needed " + ST.thresh + "–6).");
      }
      break;
    case "donor":
      if (opt === "T") { t.flags.donor = true; t.flags.donorFreeUntil = m - 1; say("equipment accepted."); }
      else if (opt === "C") { if (ok4) { t.flags.donor = true; t.flags.donorFreeUntil = 48; say("equipment accepted; donor pays the service contract to the end of Year 4."); } else say("the donor declined the condition."); }
      break;
    case "jv":
      if (opt === "T") { t.cash += 2; t.flags.jv = "offered"; for (let i = 0; i < 3; i++) t.startups.push({ id: ev.id + "s" + i, name: "JV startup " + (i + 1), since: m, jv: true }); say("+2 Cr and 3 startups."); }
      else if (opt === "C") { if (ok3) { t.cash += 1; t.flags.jv = "cond"; for (let i = 0; i < 2; i++) t.startups.push({ id: ev.id + "s" + i, name: "JV startup " + (i + 1), since: m }); say("+1 Cr and 2 startups, joint selection."); } else say("the partner declined joint selection."); }
      break;
    case "flood":
      if (opt === "T") { t.cash -= 1.5; t.zones.E.protected = true; t.zones.G.protected = true; say("drainage built; Zones E and G protected."); esg(t, m, CFG.ESG.drainage, "drainage protects the low ground"); }
      else if (opt === "C") { t.flags.insured = true; say("insurance bought (0.3 Cr a year)."); }
      break;
    case "telecom":
      if (opt === "T") { for (const z in t.zones) if (t.zones[z].svc.fibre < 1) t.zones[z].works.push({ kind: "fibre", doneAt: m + 1, startAt: m }); t.flags.telco = true; say("fibre coming to every zone; 5% of rent to the telco."); }
      else if (opt === "C") { if (ok3) { let n = 0; for (const z of ["B", "C", "D", "E", "H", "F", "G"]) if (n < 3 && t.zones[z].svc.fibre < 1 && t.zones[z].svc.road >= 0.5) { t.zones[z].works.push({ kind: "fibre", doneAt: m + 1, startAt: m }); n++; } say("fibre coming to " + n + " zones."); } else say("the telco declined."); }
      break;
    case "inquiry":
      if (opt === "T") { payCap(7); const z = pickZone(); if (z) { const id = startBuild(z, "newbuild", 12, !sc.inquiryWithdraw); say("New Build " + id + " started for the anchor."); } }
      else if (opt === "C") { if (ok3) { t.pendingAnchor = { type: "anchor", until: m + 12 }; say("the anchor will take 3 units when space is ready."); } else say("the anchor declined."); }
      break;
    case "developer":
      if (opt === "T") { for (let i = 0; i < 2 && t.hplots.includes(null); i++) { t.hplots[t.hplots.indexOf(null)] = "lease"; t.leases.push({ kind: "dev", label: "Developer ground lease (H)", income: 1.5, linked: false, units: 2, ip: 0, crisis: true }); } say("plots leased as offered."); }
      else if (opt === "C") { if (ok3 && t.hplots.includes(null)) { t.hplots[t.hplots.indexOf(null)] = "leaseC"; t.leases.push({ kind: "devC", label: "Conditional ground lease (H)", income: 1.2, linked: true, units: 2, ip: 1, crisis: false }); say("one plot leased with conditions."); } else say("the developer declined."); }
      break;
    case "bts":
      if (opt === "T") { if (t.hplots.includes(null)) { t.cash -= 7; startBuild("H", "newbuild", 12, true); t.flags.exclusive = true; say("build-to-suit started on Zone H."); } }
      else if (opt === "C") { if (ok3 && hasLabLike(t)) { t.pendingAnchor = { type: "anchor", until: m + 12 }; say("the anchor will take 3 units when space is ready."); } else say("the anchor declined."); }
      break;
    case "agency": {
      const kind = opt === "T" ? "agency" : (opt === "C" && ok4 ? "agencyL" : null);
      if (kind) { let n = 0; for (let i = 0; i < 3; i++) { const b = findSpace(t, kind); if (!b) break; t.tenants.push({ id: ev.id + "g" + i, type: kind, bid: b.id, since: m, name: "Agency office " + (i + 1) }); n++; } say(n + " agency units let" + (n < 3 ? " (not enough serviced space for all 3)" : "") + "."); }
      else if (opt === "C") say("the agency declined the SME desk.");
      break;
    }
    case "rector":
      if (opt === "T") { t.flags.share = 0.2; say("20% of surplus to the university."); }
      else if (opt === "C") { t.flags.share = ok3 ? 0.1 : 0.3; say((ok3 ? "10%" : "30%") + " of surplus agreed."); }
      else { t.flags.allocStop = true; t.ipv -= 2; say("refused; the allocation stops."); }
      break;
    case "factory":
      if (opt === "T" || (opt === "C" && ok4)) { t.cash -= 3; const id = startBuild("X", "factory", 3); if (opt === "C") bById(t, id).smeOnReady = true; say("factory bought; ready in 3 months."); }
      else if (opt === "C") say("the seller declined.");
      break;
    case "natlab":
      if (opt === "T") { t.hplots[t.hplots.indexOf("reserve")] = "natlab"; t.leases.push({ kind: "natlab", label: "National lab (H)", income: 1.0, linked: true, units: 2, ip: 3, crisis: false }); say("the national lab is coming to Zone H."); }
      break;
    case "holiday":
      if (opt === "T") { t.flags.holiday = "free"; say("rent holiday granted."); }
      else if (opt === "C") { if (ok3) { t.flags.holiday = "half"; say("anchors stay at half rent."); } else { t.tenants = t.tenants.filter(x => !(x.type === "anchor" || x.type === "bigAnchor")); say("the anchors left."); } }
      else { if (U(sc.seed, "holiday", t.name) < 2 / 3) { t.tenants = t.tenants.filter(x => !(x.type === "anchor" || x.type === "bigAnchor")); say("refused; the anchors left."); } else say("refused; the anchors stayed."); }
      break;
    case "restructure": if (opt === "T") { t.cash -= 1; t.flags.fixedRate = true; say("rate fixed at 10%."); } break;
    case "stimulus": if (opt === "T") { t.cash += 0.5 * t.startups.length; t.flags.stimulus = true; say("+" + r1(0.5 * t.startups.length) + " Cr; an extra startup applicant each quarter."); } break;
    case "solar":
      if (opt === "T") { t.cash -= 1.5; t.flags.solar = 0.3; esg(t, m, CFG.ESG.solarT, "solar canopies bought"); say("solar canopies installed; upkeep −0.3 Cr a year."); }
      else if (opt === "C") { if (ok3) { t.flags.solar = 0.1; esg(t, m, CFG.ESG.solarC, "solar power-purchase agreement"); say("PPA signed; upkeep −0.1 Cr a year."); } else say("the company declined."); }
      break;
    case "chemical": {
      const kind = opt === "T" ? "chem" : (opt === "C" && ok4 ? "chemC" : null);
      if (kind) { const b = findSpace(t, kind); if (b) { t.tenants.push({ id: ev.id + "ch", type: kind, bid: b.id, since: m, name: "Kimia Speciality Chemicals" }); esg(t, m, kind === "chem" ? CFG.ESG.chemT : CFG.ESG.chemC, kind === "chem" ? "chemicals firm discharging to the creek" : "chemicals firm under a zero-discharge covenant"); say("the firm moved into " + b.id + "."); } else say("no serviced 2-unit space free."); }
      else if (opt === "C") say("the firm refused the covenant.");
      break;

    case "audit": {
      const pass = t.esg >= 2;
      if (pass) { if (opt === "T") { t.cash -= 0.2; t.ipv += 2; esg(t, m, CFG.ESG.auditPass, "audit passed and published"); say("passed; report published (+2 impact)."); } else say("passed; nothing published."); }
      else if (opt === "T") { t.cash -= 1; esg(t, m, CFG.ESG.restore, "restoration works after the audit"); say("failed; restoration paid."); }
      else if (opt === "C") { if (ok3) { t.cash -= 0.5; esg(t, m, CFG.ESG.restore, "joint restoration plan"); say("failed; joint plan agreed."); } else { t.ipv -= 3; esg(t, m, CFG.ESG.auditFail, "audit failure ignored"); say("failed; the university declined the plan (−3 impact)."); } }
      else { t.ipv -= 3; esg(t, m, CFG.ESG.auditFail, "audit failure ignored"); say("failed and ignored (−3 impact)."); }

      else if (opt === "C") { if (ok3) { t.cash -= 0.4; t.flags.rain = true; esg(t, m, CFG.ESG.rain, "shared water storage"); say("shared scheme agreed."); } else { if (t.zones.G.mode !== "park") t.flags.droughtUntil = m + 11; say("the university declined; " + (t.zones.G.mode === "park" ? "your retention park covers you." : "water surcharge for 12 months.")); } }
      else { if (t.zones.G.mode !== "park" && !t.flags.rain) { t.flags.droughtUntil = m + 11; say("water surcharge for 12 months."); } else say("your storage covers you."); }

      if (opt === "T") t.cash -= 1; else if (opt === "C" && ok3) t.cash -= 0.5;
      for (let i = 0; i < n; i++) t.applicants.push({ id: ev.id + "t" + i, type: "spinoff", arrive: m, expire: m + CFG.WAIT - 1, name: NAMES_A[(i * 7 + m) % NAMES_A.length] + " " + NAMES_B.spinoff[i % 6] });
      if (opt !== "L") say(n ? n + " spin-off applicants." : "the university declined.");
      break;
    }
  }
}

/* this month's money at annual rates (Cr a year) and the month's net result (Cr) */
function money(t, sc, m) {
  const S = inDownturn(sc, m) ? CFG.SEV[sc.downturn.sev] : null;
  let rent = 0; for (const x of t.tenants) rent += rentOf(t, x, m, sc);
  const telco = t.flags.telco ? 0.05 * rent : 0; rent -= telco;
  const lease = t.leases.reduce((a, l) => a + (leaseActive(t, l) ? l.income : 0), 0);
  const lin = linkedCount(t);
  let facInc = 0; if (t.fac.lab) facInc += Math.min(2.0, 0.4 * lin); facInc += CFG.STARTUP.fee * t.startups.length;
  if (t.fac.services) facInc += 0.15 * t.tenants.length;
  const y = Math.ceil(m / 12); const alloc = t.flags.allocStop ? 0 : (CFG.ALLOC_YR[y - 1] || 0);
  const upkeep = annualUpkeep(t, m);
  const interest = rateOf(t, sc, m) * t.debt + (S ? CFG.EMERG_P3 : CFG.EMERG) * t.emerg;
  let net = (rent + lease + facInc + alloc - upkeep - interest) / 12, share = 0;
  if (net > 0 && t.flags.share) { share = t.flags.share * net; net -= share; }
  return { rent, telco, lease, facInc, alloc, upkeep, interest, share: share * 12, net };
}

/* ---------------------------------------------------------------- months */
function startMonth(t, sc, m) {
  if (m > 1 && (m - 1) % 12 === 0) { t.socioLog = t.socioLog || []; t.socioLog.push(Object.assign({ m: m - 1 }, socio(t))); }
  t.month = m;
  if ((m - 1) % 3 === 0) { t.ap = (t.apQ || CFG.AP_Q) + (t.fac.mgmt ? 1 : 0) - t.apPenalty; t.apPenalty = 0; t.flags.exclQ = 0; }
  // applicants
  t.applicants = t.applicants.filter(a => a.expire >= m);
  let arr = sc.arrivals[m] || [];
  if (inDownturn(sc, m)) { const keep = CFG.SEV[sc.downturn.sev].arr; arr = arr.filter((a, k) => U(sc.seed, "arrKeep", m, k) < keep); }
  for (const a of arr) t.applicants.push(Object.assign({}, a));
  if ((m - 1) % 3 === 0) {
    const extra = (t.fac.liaison ? 1 : 0) + (t.tenants.some(x => x.type === "anchor" || x.type === "bigAnchor") ? 1 : 0) + (t.flags.cert && t.esg >= CFG.ESG.certMin ? 1 : 0);
    for (let k = 0; k < extra; k++) t.applicants.push(applicant(sc.seed, "x" + m + "-" + k, pickType(U(sc.seed, "xT", m, k)), m));
    if (t.flags.stimulus) t.applicants.push(applicant(sc.seed, "st" + m, "startup", m));
  }
  if (sc.downturn.forecastAt && m === sc.downturn.forecastAt) note(t, m, "Forecast: economists expect a " + CFG.SEV[sc.downturn.sev].label.toLowerCase() + " downturn from " + monthName(sc.downturn.start) + ". Rates will rise and the bank will cut the loan limit to " + CFG.SEV[sc.downturn.sev].cap + " Cr.", "phase");
  if (m === CFG.ZONES.H.release && !t.zones.H.locked) note(t, m, "Land Grant: Zone H is released. Each plot needs a signed use by the end of Year 3.", "phase");
  if (m === sc.downturn.start) { note(t, m, "Downturn: " + CFG.SEV[sc.downturn.sev].label + ". Tenants are closing, rates are rising and the bank has cut the loan limit to " + CFG.SEV[sc.downturn.sev].cap + " Cr.", "phase"); t.snap.let0 = tenantUnits(t); t.snap.bailAtDown = t.bailouts; }
}

function endMonth(t, sc, m) {
  const S = inDownturn(sc, m) ? CFG.SEV[sc.downturn.sev] : null;
  // works and buildings complete
  for (const z in t.zones) {
    const Z = t.zones[z];
    for (const w of Z.works) if (w.doneAt === m) {
      if (w.kind === "clear") { Z.mode = "open"; note(t, m, "Zone F cleared."); }
      else if (w.kind === "retention") { Z.mode = "open"; Z.protected = true; t.zones.E.protected = true; note(t, m, "Retention works finished: Zones E and G protected."); esg(t, m, CFG.ESG.retention, "retention works finished"); }
      else { const k = w.kind === "roadHalf" ? "road" : (w.kind === "powerShared" ? "power" : w.kind); Z.svc[k] = 1; note(t, m, CFG.WORKS[w.kind].label + " finished in Zone " + z + "."); }
    }
    Z.works = Z.works.filter(w => w.doneAt > m);
  }
  for (const b of t.buildings) if (b.status === "building" && b.readyAt === m) {
    b.status = "ready"; note(t, m, b.label + " is ready (" + b.units + " units)" + (svcOK(t, b.zone, false) ? "." : ", but the zone lacks services: nobody can move in yet."), svcOK(t, b.zone, false) ? "info" : "warn");
    if (b.preLet === true) { t.tenants.push({ id: "pl" + b.id, type: "bigAnchor", bid: b.id, since: m, name: "Anchor R&D Centre" }); note(t, m, "The anchor moved into " + b.id + ".", "good"); }
    else if (b.preLet === false) note(t, m, "The anchor withdrew: " + b.id + " stands empty.", "warn");
    if (b.smeOnReady) t.tenants.push({ id: "fs" + b.id, type: "sme", bid: b.id, since: m, name: "Factory SME" });
  }
  if (t.pendingAnchor) {
    if (m > t.pendingAnchor.until) { t.pendingAnchor = null; note(t, m, "The anchor lost patience and went elsewhere.", "warn"); }
    else { const b = findSpace(t, "anchor"); if (b && hasLabLike(t)) { t.tenants.push({ id: "pa" + m, type: "anchor", bid: b.id, since: m, name: "Anchor R&D Lab" }); t.pendingAnchor = null; note(t, m, "The anchor moved into " + b.id + ".", "good"); } }
  }
  // H reclaim, fund lapse
  if (m === CFG.ZONES.H.signBy) { const n = t.hplots.filter(p => p === null).length; t.hplots = t.hplots.map(p => p === null ? "reclaimed" : p); if (n) note(t, m, n + " unsigned Zone H plot(s) reclaimed by the university.", "warn"); }
  // flood
  if (m === CFG.FLOOD.month && sc.flood) {

/* -------------------------------------------------------------- spotlight */
/* Dim the page except one element and ring it; follows the element while it scrolls. ms > 0: fades after ms

  SPOT = null;

  let tag = null; if (label) { tag = document.createElement('div'); tag.className = 'spottag'; tag.textContent = label; }
  document.body.appendChild(ring); if (tag) document.body.appendChild(tag);
  const p = pad === undefined ? 6 : pad;
  const me = { ring, tag, raf: 0, el };
  SPOT = me;
  function place() {
    if (SPOT !== me) return;
    const r = el.getBoundingClientRect();
    ring.style.left = (r.left - p) + 'px'; ring.style.top = (r.top - p) + 'px'; ring.style.width = (r.width + 2 * p) + 'px'; ring.style.height = (r.height + 2 * p) + 'px';
    if (tag) {

      tag.classList.toggle('below', below);

      tag.style.top = (below ? r.bottom + p + 10 : r.top - p - th - 10) + 'px';

    me.off = () => clearSpot();
    setTimeout(() => { if (SPOT === me) { document.addEventListener('pointerdown', me.off, true); document.addEventListener('keydown', me.off, true); } }, 60);
  }
  return me;
}

/* ------------------------------------------------------------------ tour */
/* stops: [{ sel, title, text }] (title/text: functions or strings). Esc closes; ← / → step. */
function createTour(stops) {
  const t = () => cfg.t;
  const T = { i: -1, call: null, block: null, key: null };
  const val = (v) => (typeof v === 'function' ? v() : v);
  const visible = (el) => !!el && el.getClientRects().length > 0;
  function show(k, dir) {
    const n = stops.length;
    while (k >= 0 && k < n && !visible($(stops[k].sel))) k += dir || 1;
    if (k < 0 || k >= n) { close(); return; }
    T.i = k; const s = stops[k], el = $(s.sel);
    try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
    if (!T.call) { T.call = document.createElement('div'); T.call.className = 'tourcall'; T.call.setAttribute('role', 'dialog'); T.call.setAttribute('aria-modal', 'true'); document.body.appendChild(T.call); }
    const last = k === n - 1;
    T.call.innerHTML = '<div class="tchead"><span class="tcn">' + escapeHtml(t()('ui.tour.of', { i: k + 1, n })) + '</span><b>' + escapeHtml(val(s.title)) + '</b><button type="button" class="tcx" data-a="close" aria-label="' + escapeHtml(t()('ui.tour.close')) + '">×</button></div>' +
      '<p>' + escapeHtml(val(s.text)) + '</p><div class="tcbtns">' + (k > 0 ? '<button type="button" class="tb" data-a="back">' + escapeHtml(t()('ui.tour.back')) + '</button>' : '') +
      '<button type="button" class="tb primary" data-a="' + (last ? 'close' : 'next') + '">' + escapeHtml(t()(last ? 'ui.tour.done' : 'ui.tour.next')) + '</button></div>';
    T.call.setAttribute('aria-label', val(s.title));
    T.call.querySelectorAll('button[data-a]').forEach((b) => b.addEventListener('click', () => { const a = b.dataset.a; if (a === 'next') show(T.i + 1, 1); else if (a === 'back') show(T.i - 1, -1); else close(); }));
    spotlight(el, { ms: 0, dim: 0.5, pad: 4, onPlace: placeCall });
    const nb = T.call.querySelector('.tb.primary'); if (nb) nb.focus({ preventScroll: true });
  }
  function placeCall(r) {

    if (r.bottom + m + ch < H) { y = r.bottom + m; x = r.left; }
    else if (r.top - m - ch > 0) { y = r.top - m - ch; x = r.left; }
    else if (r.right + m + cw < W) { x = r.right + m; y = r.top; }
    else if (r.left - m - cw > 0) { x = r.left - m - cw; y = r.top; }
    else { x = (W - cw) / 2; y = (H - ch) / 2; }
    c.style.left = Math.max(8, Math.min(W - cw - 8, x)) + 'px'; c.style.top = Math.max(8, Math.min(H - ch - 8, y)) + 'px';

    T.key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } else if (e.key === 'ArrowRight') { e.preventDefault(); show(T.i + 1, 1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); if (T.i > 0) show(T.i - 1, -1); } };

}

/* ⓘ button: a dialog naming every area of the screen (clickable map + list), the symbols and colours, the

/* ------------------------------------------------------ predict-first */
function createPredict({ el, narrator, onAnswered }) {
  const t = () => cfg.t;
  const P = { state: null };
  function show(card) {
    const pq = card.predict, box = $(el);
    P.state = { card, chosen: -1, revealed: false };
    box.hidden = false;
    box.innerHTML = '<h3>' + t()('predict.title') + '</h3><p>' + t()(pq.q) + '</p><div class="pqopts">' +
      ['a', 'b', 'c'].map((o, i) => '<button type="button" class="btn" data-i="' + i + '">' + t()(pq.q + '.' + o) + '</button>').join('') +
      '<button type="button" class="btn ghost" data-i="-1">' + t()('predict.skip') + '</button></div>';
    $$(el + ' button').forEach((b) => b.addEventListener('click', () => answer(parseInt(b.dataset.i, 10))));
  }
  function hide() { P.state = null; const box = $(el); if (box) { box.hidden = true; box.innerHTML = ''; } }
  function answer(i) {
    if (!P.state) return;

    $$(el + ' button').forEach((b) => { b.disabled = true; b.classList.toggle('chosen', parseInt(b.dataset.i, 10) === i); });
    if (i >= 0) { if (onAnswered) onAnswered(i); narrator.say('predict.noted', {}, true); } else hide();
  }
  function reveal() {
    const s = P.state; if (!s || s.revealed || s.chosen < 0) return;
    s.revealed = true;
    const pq = s.card.predict, right = s.chosen === pq.answer;
    narrator.say(right ? 'predict.right' : 'predict.wrong', { r: t()(pq.q + '.r') }, true);
    $$(el + ' button').forEach((b) => { const k = parseInt(b.dataset.i, 10); b.classList.toggle('right', k === pq.answer); b.classList.toggle('wrongpick', k === s.chosen && !right); });
  }
  return { show, hide, answer, reveal, get state() { return P.state; } };
}

    const k = list.findIndex((q) => q.id === id); if (k >= 0) list[k] = p; else list.push(p);

    /* theory */
    'why.0': '<h4>What the park score measures</h4><p>Impact comes from tenants: each type brings IP points (anchors most, back-office none). The score adds a bonus for financial cover and subtracts penalties for drift (share of unlinked tenants) and uncovered debt.</p><h4>FCR12</h4><p>Committed income over the next twelve months divided by the costs it must cover: upkeep, interest and emergency loans. Above 1.3 earns the full bonus; below 0.8 earns none; below that a penalty.</p><h4>Action points</h4><p>Three per quarter. Works, buildings and facilities each use one; admissions and loans do not. Unused points are lost, so plan each quarter.</p>',
    'why.1': '<h4>Loans and headroom</h4><p>The bank lends up to a cap that falls in a downturn. Debt above cash is penalised in the park score, and an emergency loan (bailout) closes the door to Gold.</p><h4>Drift</h4><p>The share of units let to unlinked tenants (back-office, agencies, chemicals). Above 50 % the score loses 5 points, above 70 % it loses 10: a technology park that fills up with offices stops being one.</p><h4>Zone H</h4><p>Released in Year 3 with four plots. Each plot signed for a building, a lease with covenant, a reserve or a national lab earns Phase 2 marks; unsigned plots are reclaimed.</p>',
    'why.2': '<h4>ESG as a running score</h4><p>Every environmental decision moves a running ESG score: clearing forest −3, building on wetland −1, a buffer +2, retention works +1, solar or certification +1 to +2. Part E rewards the score, and Gold needs it at or above zero.</p><h4>Downturn mechanics</h4><p>Rates rise, the loan cap falls, unlinked rents fall and some tenants leave now and again twelve months later. Survival marks need no bailout, FCR12 above 1 and a good share of tenants retained.</p><h4>Anchors and labs</h4><p>An R&D anchor takes three units and brings the most IP; a shared lab raises start-up graduation. Together they make the park university-linked, which is what the mandate pays for.</p>',

<script>

/* IMPAK v0.6 — live sessions against the Apps Script backend (apps-script/Code.gs).

   decide, gmSet, gmUpdate, on/emit. The browser keeps a local copy and polls the server for changes;
   writes are optimistic (applied locally at once, then posted). */
(function (root) {
'use strict';
const G = root.IMPAK, PB = root.PB;
const ls = { get(k) { try { return root.localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { root.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }, del(k) { try { root.localStorage.removeItem(k); } catch (e) { /* ignore */ } } };

/* ------------------------------------------------------------------ API url */
function apiUrl() {
  const q = new URLSearchParams(root.location.search).get('api');
  if (q === 'off') { ls.del('impak.api'); return root.IMPAK_API || ''; }
  if (q && /^https?:\/\//.test(q)) { ls.set('impak.api', q); return q; }
  return ls.get('impak.api') || root.IMPAK_API || '';
}
const API = apiUrl();
class ApiError extends Error { constructor(key, msg) { super(msg || key); this.key = key; } }
async function call(payload) {
  if (!API) throw new ApiError('join.err.net', 'no API');
  let r;
  try {
    if (payload.op === 'state' || payload.op === 'room' || payload.op === 'ping') {
      const u = new URL(API); for (const k in payload) u.searchParams.set(k, payload[k]);
      r = await fetch(u.toString(), { method: 'GET', redirect: 'follow', cache: 'no-store' });
    } else r = await fetch(API, { method: 'POST', redirect: 'follow', body: JSON.stringify(payload) });   // text/plain body: a "simple" request, no preflight
  } catch (e) { throw new ApiError('join.err.net', String(e)); }
  let j; try { j = await r.json(); } catch (e) { throw new ApiError('join.err.net', 'bad json'); }
  if (j && j.error) throw new ApiError({ room: 'join.err.room', pin: 'join.err.pin', code: 'join.err.code', fields: 'join.err.fields' }[j.error] || 'join.err.net', j.message || j.error);
  return j;
}

/* ------------------------------------------------------------------ store */
function deepMerge(a, b) { return G.deepMerge(JSON.parse(JSON.stringify(a || {})), b); }
function ApiStore(session) {
  let SEQ = 0; const nextSeq = () => { SEQ = (SEQ + 1) % 1000; return Date.now() * 1000 + SEQ; };
  const s = {
    mode: 'live', version: 0, listeners: new Set(), game: null, orders: {}, decisions: {}, ready: false, db: true,
    lastOk: 0, lastTry: 0, pending: 0, timer: null, session,
    emit() { this.version++; this._cache = null; for (const f of this.listeners) f(this); },
    on(f) { this.listeners.add(f); },
    ordersFor(team) { return this.orders[team] || []; },
    decisionOf(eid, team) { return (this.decisions[eid] || {})[team] || null; },
    async placeOrder(team, o, t) {
      const order = Object.assign({ t, seq: nextSeq() }, o);
      (this.orders[team] = this.orders[team] || []).push(order); this.emit();
      await this.post({ op: 'order', team, order });
    },
    async decide(team, eid, opt) {
      (this.decisions[eid] = this.decisions[eid] || {})[team] = opt; this.emit();
      await this.post({ op: 'decide', team, eid, opt });
    },
    async gmSet(g) {
      const r = await this.post({ op: 'gm', action: 'set', game: g });
      if (r && r.game) { this.game = r.game; this.orders = {}; this.decisions = {}; this._auto = null; }
      if (r && r.room) { this.session.room = r.room; if (r.token) this.session.token = r.token; saveSession(this.session); }
      this.emit();
    },
    async gmUpdate(p) {
      this.game = deepMerge(this.game, p); this.emit();
      await this.post({ op: 'gm', action: 'update', patch: p });
    },
    async post(payload) {
      this.pending++;
      try { return await call(Object.assign({ room: this.session.room, token: this.session.token }, payload)); }
      catch (e) { G.HOST.toast(String(e.message || e), 'bad'); throw e; }
      finally { this.pending--; setTimeout(() => this.poll(), 800); }
    },
    async poll() {
      if (!this.session.room || this._polling) return; this._polling = true; this.lastTry = Date.now();
      try {
        const r = await call({ op: 'state', room: this.session.room, team: this.session.team || '', token: this.session.token || '' });
        if (r.serverTime) { const off = r.serverTime - Date.now(); if (Math.abs(off) > 400 && onOffset) onOffset(off); }
        this.game = r.game || null; this.orders = r.orders || {}; this.decisions = r.decisions || {};
        this.ready = true; this.lastOk = Date.now(); this.emit();
